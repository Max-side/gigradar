<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新上架 · GigRadar</title>
<link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="wordmark">GigRadar</div>
    <button class="icon-btn" aria-label="搜尋">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </div>

  <div class="page-header">
    <div class="page-title">新上架</div>
    <span class="badge-onsale" style="margin-top:10px;">今日新增 <span id="today-count">1</span> 筆 · 近 7 日共 <span id="week-count">2</span> 筆</span>
  </div>

  <!-- M1 骨架階段：寫死假資料；M6 起由 src/app.js 讀 data/digest.json 動態產生 -->
  <div class="event-list" id="event-list">
    <div class="day-group">
      <div class="day-label">今天新增</div>
      <div class="event-card" data-event-id="demo-3">
        <div class="event-date">
          <div class="event-date__day">02</div>
          <div class="event-date__weekday">MON</div>
        </div>
        <div class="event-body">
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="badge-new">新</span>
            <div class="event-title">幾何浪</div>
          </div>
          <div class="tag-row"><span class="tag-perf">專場</span></div>
          <div class="event-meta">The Wall · 台北 · 11/2 19:30</div>
          <div class="event-price">NT$700 up <span class="muted">· KKTIX</span></div>
        </div>
        <button class="pill-arrow" aria-label="購票">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="./index.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      時間表
    </a>
    <a class="nav-item nav-item--active" href="./new.html">
      <span class="nav-item__pill">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .9-.35 1.77-.98 2.4L5 15h14l-1.02-1.1a3.4 3.4 0 0 1-.98-2.4V8a5 5 0 0 0-5-5Z"/></svg>
        新上架
      </span>
    </a>
    <a class="nav-item" href="./favorites.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5l2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.5l1-5.8L3.5 9.6l5.9-.8Z"/></svg>
      收藏
    </a>
    <a class="nav-item" href="./settings.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12"/></svg>
      設定
    </a>
    <a class="fab" href="./add.html" aria-label="新增場次">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </nav>

</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
