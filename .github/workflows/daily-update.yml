name: Daily Update

on:
  # Schedule temporarily disabled (2026-09-16): a real run from a GitHub-hosted
  # runner got 403'd by tixcraft (拓元) and partially by KKTIX's search-based
  # strategy — see issue #1. Because fetch.mjs has no "keep previous data when
  # a source fails" fallback yet (tracked in GIGRADAR-SPEC.md §4.2), that run
  # wiped real needs-review.json data, which had to be reverted (583fe35).
  # Re-enable the schedule below once that fallback exists, or once the
  # blocking is confirmed resolved another way.
  # schedule:
  #   - cron: "0 0 * * *" # 08:00 CST = 00:00 UTC (SRS D1)
  workflow_dispatch: {} # manual trigger — safe to run for testing, just don't rely on its output yet

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit data/*.json
      issues: write # FR-14/M10: notify.mjs opens an issue on source anomalies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/* # avoid pinning to a version Actions runners eventually deprecate
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built-in, no extra secret needed (SPEC §10)
      - run: |
          git config user.name "gigradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily data update $(date +%F)"
          git push
