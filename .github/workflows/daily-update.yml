name: Daily Update

on:
  # Re-enabled 2026-09-16 after adding the source-fallback safety net
  # (scripts/source-fallback.mjs): a run from GitHub Actions still gets 403'd
  # by tixcraft (拓元) and KKTIX's search strategy (see issue #1), but fetch.mjs
  # now reuses each blocked source's previous data instead of wiping it —
  # verified against a real run (commit f6f39d3 only touched 6 metadata
  # lines, not the 600-line data loss from before this fix). See
  # GIGRADAR-SPEC.md §4.2 and HANDOFF.md's "M11 的重大發現" for the full story.
  schedule:
    - cron: "0 0 * * *" # 08:00 CST = 00:00 UTC (SRS D1)
  workflow_dispatch: {} # manual trigger for debugging

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit data/*.json
      issues: write # FR-14/M10: notify.mjs opens an issue on source anomalies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/* # avoid pinning to a version Actions runners eventually deprecate
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built-in, no extra secret needed (SPEC §10)
      - run: |
          git config user.name "gigradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily data update $(date +%F)"
          git push
