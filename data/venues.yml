- match: "THE PILLARS"
  city: 台中
- match: "CLASH NEW TAIPEI"
  city: 新北
- match: "台中迴響"
  city: 台中
- match: "玉成戲院"
  city: 台北
- match: "百樂門酒館"
  city: 高雄
- match: "三創"
  city: 台北
