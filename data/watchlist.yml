# 追蹤名單（FR-19 的手動/免費版本，2026-09-17 起）。
#
# 這份清單不會被 scripts/fetch.mjs 或任何自動化 pipeline讀取——它是給「你在
# Claude Code 對話裡叫我照著查一次」用的參考清單，不是程式的輸入檔。原因見
# HANDOFF.md「追蹤名單巡檢怎麼運作」：AI 網路搜尋只有在你主動在對話裡開口時
# 才會發生（用你既有的 Claude 方案，不用另外的 API/費用），沒有排程會自動
# 讀這份檔案去執行任何動作。
#
# 用法：跟我說「照追蹤名單查一次」，我就會逐一搜尋下面每個名字最近有沒有
# 台灣的演出公告，找到的候選場次會先給你看過，你確認後可以用手動新增場次
# 功能（add.html）加進系統，或整理進 data/artists.yml／data/venues.yml。
#
# type: artist（音樂人/樂團）｜venue（場館）｜promoter（主辦單位）
# note: 選填，提醒自己為什麼在追蹤（例如「常態巡演」「已錯過上次公告」）
#
# 範例（尚未真的加入清單）：
# - name: "深海系樂團"
#   type: artist
#   note: "常態巡演，容易漏看公告"

